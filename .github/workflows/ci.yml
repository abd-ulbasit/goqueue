# =============================================================================
# GOQUEUE CI PIPELINE
# =============================================================================
#
# PRODUCTION-HARDENED CI
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ This pipeline is STRICT — every job must pass for the build to be green.   │
# │                                                                            │
# │ No `continue-on-error`, no `|| true`. If something fails, the build       │
# │ fails. This is deliberate:                                                 │
# │                                                                            │
# │   - Linting catches real bugs → fix them, don't ignore them               │
# │   - Tests must pass → flaky tests get fixed, not skipped                  │
# │   - Security scans matter → vulnerable deps get updated                   │
# │                                                                            │
# │ COMPARISON:                                                                │
# │   - Kafka: Strict CI, every PR must pass all checks                       │
# │   - NATS: Strict CI on GitHub Actions                                     │
# │   - CockroachDB: Extremely strict (1000+ tests, all must pass)           │
# │                                                                            │
# │ IF A JOB IS GENUINELY FLAKY:                                              │
# │   Fix it. Don't add `continue-on-error`. Flaky tests are bugs.           │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# TRIGGERS:
#   - Push to main: Full pipeline (lint + test + security + build + docker)
#   - Pull request to main: Full pipeline (no push)
#
# RELEASE is a separate workflow (release.yml), triggered by v* tags.
#
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    # Don't run CI on tag pushes — that's handled by release.yml
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

env:
  # No GO_VERSION here on purpose. Every setup-go step uses
  # `go-version-file: go.mod` so the toolchain is whatever the module declares.
  # A pinned version silently rots: when a dependency bump raised go.mod to
  # 1.25 while this said 1.24, Go downloaded a second toolchain underneath the
  # installed one and `go test -cover` died with `go: no such tool "covdata"`,
  # failing every dependency PR for a reason that had nothing to do with the
  # dependency.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs for the same branch/PR
# WHY: Saves CI minutes. If you push again, the old run is stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Lint — Static Analysis
  # ============================================================================
  #
  # WHY FIRST?
  #   Linting is the fastest check (~30s). If code doesn't pass style/safety
  #   checks, there's no point running slower tests. Fast feedback.
  #
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  # ============================================================================
  # Test — Unit and Integration Tests
  # ============================================================================
  #
  # RACE DETECTOR:
  #   -race enables Go's race detector. It's slower (~2-10x) but catches
  #   data races that cause production crashes. ALWAYS run tests with -race.
  #
  # COVERAGE:
  #   Generate coverage report for Codecov integration.
  #   Not a gate (we don't enforce minimum coverage), but useful for tracking.
  #
  #   The upload is conditional on CODECOV_TOKEN being set, and fails loudly
  #   when it is. It used to run unconditionally with fail_ci_if_error: false,
  #   which meant every run since the workflow was added logged
  #
  #       Token required - not valid tokenless upload
  #
  #   and then reported success. Coverage was computed on every push and
  #   silently thrown away, and the green check said otherwise. A skipped step
  #   that says why is honest; a passing step that uploaded nothing is not.
  #
  #   The profile is kept as an artifact either way, so the numbers are
  #   available from the run even with no Codecov account attached.
  #
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Mapped to job env because the `secrets` context is not available in a
      # step-level `if:`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...

      - name: Upload coverage profile as an artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always() && env.CODECOV_TOKEN != ''
        with:
          files: coverage.out
          # Loud on purpose. A broken upload should be a red step, not a log
          # line nobody reads.
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

      - name: Note that coverage was not uploaded
        if: always() && env.CODECOV_TOKEN == ''
        run: |
          echo "::notice title=Coverage not uploaded::CODECOV_TOKEN is not set on this repository, so the Codecov upload was skipped. Coverage was still measured and is attached to this run as the 'coverage-profile' artifact. To enable uploads, add the repository secret CODECOV_TOKEN."

  # ============================================================================
  # Security — Vulnerability Scanning
  # ============================================================================
  #
  # TWO TOOLS:
  #   1. govulncheck: Checks Go dependencies for known vulnerabilities (CVEs)
  #   2. gosec: Static analysis for security issues in our code
  #
  # WHY BOTH?
  #   - govulncheck: "Are my dependencies vulnerable?"
  #   - gosec: "Does MY code have security bugs?"
  #
  # ============================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -----------------------------------------------------------------------
      # govulncheck: Checks Go modules AND stdlib for known CVEs.
      #
      # WHY ADVISORY-ONLY:
      #   govulncheck may flag stdlib vulnerabilities (e.g., crypto/tls)
      #   that can only be fixed by upgrading the Go toolchain itself.
      #   We can't block CI on issues with no available fix.
      #
      #   Third-party dependency vulns → we CAN fix (update go.mod)
      #   Standard library vulns → we CANNOT fix (wait for Go patch)
      #
      # The output is always printed and annotated as a warning so
      # vulnerabilities are visible but don't block merges for unfixable
      # stdlib issues.
      # -----------------------------------------------------------------------
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 || echo "::warning::govulncheck found vulnerabilities — review output above. Stdlib vulns require a Go toolchain update."

      # -----------------------------------------------------------------------
      # gosec: Static analysis for security bugs in OUR code.
      # Run as CLI (not action) for reliable SARIF output path.
      # -----------------------------------------------------------------------
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        continue-on-error: true  # OK here: Code Scanning might not be enabled
        with:
          sarif_file: gosec.sarif

  # ============================================================================
  # Benchmark — Performance Regression Detection
  # ============================================================================
  #
  # WHY BENCHMARKS IN CI?
  #   Performance regressions are bugs. A "refactor" that makes publish
  #   10x slower is a production incident waiting to happen.
  #
  # HOW IT WORKS:
  #   1. Run Go benchmarks (-bench=. -benchmem)
  #   2. Upload results as artifact for historical comparison
  #   3. On PRs: Download baseline from main, run benchstat for comparison
  #
  # COMPARISON:
  #   - Kafka: Runs JMH benchmarks in separate nightly pipeline
  #   - NATS: Benchmarks in CI with manual threshold checks
  #   - CockroachDB: Dedicated benchmark infrastructure (roachperf)
  #   - goqueue: Lightweight benchstat comparison in CI
  #
  # NOTE: CI runners have variable performance. Small fluctuations (<10%)
  # are expected. Only flag regressions >20% as failures.
  #
  # ============================================================================
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ -count=3 -timeout=10m \
            ./internal/storage/... ./internal/broker/... \
            | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.txt
          retention-days: 90

      # On PRs: compare against main branch baseline if available
      - name: Download baseline benchmarks
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v21
        with:
          name: benchmark-results-*
          branch: main
          workflow: ci.yml
          path: baseline/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Compare benchmarks (PR only)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE=$(find baseline/ -name 'benchmark-results.txt' -type f | head -1)
          if [ -n "$BASELINE" ]; then
            echo "### Benchmark Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            benchstat "$BASELINE" benchmark-results.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No baseline benchmarks found for comparison (first run on main?)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # Build — Cross-platform Binary Compilation
  # ============================================================================
  #
  # MATRIX STRATEGY:
  #   Build for every OS/arch we support. This catches platform-specific
  #   compilation issues early (e.g., syscall differences, cgo issues).
  #
  # WHY CGO_ENABLED=0?
  #   Static binaries. No libc dependency. Runs anywhere.
  #   Smaller Docker images (can use scratch/distroless).
  #
  # ============================================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o goqueue-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/goqueue
          go build -trimpath -ldflags="-s -w" -o goqueue-cli-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/goqueue-cli
          go build -trimpath -ldflags="-s -w" -o goqueue-admin-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/goqueue-admin

  # ============================================================================
  # Docker — Build (and Push on main)
  # ============================================================================
  #
  # MULTI-PLATFORM:
  #   linux/amd64 + linux/arm64. Covers x86 servers and ARM (Graviton, M-series).
  #
  # PUSH RULES:
  #   - PRs: Build only (verify Dockerfile works)
  #   - Push to main: Build + push to GHCR
  #
  # CACHING:
  #   GitHub Actions cache (type=gha) for Docker layers. Dramatically speeds
  #   up rebuilds when only source code changes (deps layer is cached).
  #
  # ============================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cheap, and it fails in two seconds with a clear message instead of
      # after a multi-arch buildx run. This pairing going out of sync is what
      # deadlocked seven Dependabot PRs.
      - name: Check the base image can build this module
        run: ./scripts/check-toolchain.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  # ============================================================================
  # Proto — Protobuf Lint and Breaking Change Detection
  # ============================================================================
  proto:
    name: Proto Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned rather than `latest`. `latest` resolves through a release-API
      # call on every run, so the job depends on that call succeeding and on
      # whatever buf shipped that morning: it failed here on 2026-07-27 in a
      # commit that touched no proto and no CI step it uses. A pinned version
      # fails only when someone changes this line.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0

      - name: Buf lint
        run: buf lint api/proto

      # subdir is load-bearing. The input `api/proto` is a module root, so buf
      # sees its files as `goqueue.proto`, while the --against reference points
      # at the whole repository, where the same file is `api/proto/goqueue.proto`.
      # Comparing those two roots makes every file look deleted:
      #
      #   <input>:1:1:Previously present file "api/proto/goqueue.proto" was deleted.
      #
      # Because this step only runs on pull_request, main never exercised it and
      # the check failed on every PR since it was added, including ones that
      # touched no proto at all.
      - name: Buf breaking change detection
        run: buf breaking api/proto --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=api/proto'
        if: github.event_name == 'pull_request'

  # ============================================================================
  # Dependency Review — PR-only check for vulnerable new dependencies
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

# =============================================================================
# GOLANGCI-LINT CONFIGURATION (schema v2)
# =============================================================================
#
# RUN:
#   make lint                      # via Makefile
#   golangci-lint run              # check all issues
#   golangci-lint run --fix        # auto-fix what is fixable
#
# MIGRATED FROM v1. golangci-lint v1 is end-of-life and refuses to load a
# config for a module whose go directive is 1.25 or newer:
#
#   can't load config: the Go language version (go1.24) used to build
#   golangci-lint is lower than the targeted Go version (1.25.0)
#
# That is what failed every dependabot PR here, because bumping a dependency
# such as golang.org/x/sys also bumps the go directive. The v1 config is in
# git history if the old wording is ever wanted.
#
# LINTER SELECTION, grouped by what each one catches:
#
#   CORRECTNESS   errcheck (unchecked errors), govet (suspicious constructs),
#                 staticcheck (SA* analysis), ineffassign, unused
#   PERFORMANCE   prealloc, copyloopvar
#   SECURITY      gosec
#   QUALITY       gocritic, noctx (requests without a context), bodyclose
#                 (leaked response bodies), errname (ErrFoo naming),
#                 errorlint (%w wrapping)
#   STYLE         revive, misspell, with gofmt/goimports as formatters
#
# In v2 the correctness set (errcheck, govet, staticcheck, ineffassign,
# unused) is the "standard" default, so those no longer appear under `enable`.
# =============================================================================

version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - prealloc
    - revive
  settings:
    # staticcheck: v2 turns on the ST* (style) and QF* (quickfix) families that
    # v1 never ran. Enabling them wholesale would add 57 findings that are
    # purely stylistic (37 "could remove embedded field from selector", 20
    # "error strings should not be capitalized") and zero bugs. The SA*
    # correctness analysis, which is why staticcheck is here at all, stays on.
    staticcheck:
      checks:
        - all
        - -ST1005
        - -QF1001
        - -QF1006
        - -QF1008

    # errcheck: unchecked errors are the largest source of silent Go bugs.
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - crypto/rand.Read
        # rand.Read cannot fail as of Go 1.15; it always returns a nil error.
        - (math/rand).Read
        - math/rand.Read
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
        - G304
        - G401
        - G501
        - G115
    # govet: fieldalignment is noisy for trivial savings. shadow flags the
    # standard `if err := ...; err != nil` pattern in nested scopes, which is
    # idiomatic Go rather than a defect.
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Generated protobuf code is not ours to lint.
      - linters:
          - all
        path: api/proto/gen/
      # Tests: the opinion linters are noise on table-driven helpers. The
      # correctness linters still apply to test code.
      - linters:
          - bodyclose
          - errcheck
          - gocritic
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - gocritic
        path: cmd/
      - linters:
          - errcheck
        path: internal/cli/
      - linters:
          - errcheck
        path: cmd/goqueue-admin/
      - linters:
          - errcheck
        path: cmd/goqueue-cli/
      - linters:
          - errcheck
          - noctx
        path: scripts/
      - linters:
          - gocritic
        text: commentFormatting
      - linters:
          - revive
        text: unused-parameter
      # internal/grpc/services.go re-exports protobuf-generated types under
      # their generated names (ConsumeResponse_Messages,
      # HealthService_WatchServer, and so on). The underscores are not a style
      # choice: the alias has to match the name protoc emits, and revive is
      # already silenced per-line for the same reason. ST1003 has no per-line
      # nolint that survives alongside the revive one, so it is scoped here.
      - linters:
          - staticcheck
        text: 'ST1003'
        path: internal/grpc/services\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
